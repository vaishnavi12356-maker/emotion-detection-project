<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Watson NLP Emotion Detector</h1>
    <form id="emotionForm">
        <textarea id="text" rows="5" cols="50" placeholder="Enter text to analyze..."></textarea><br>
        <button type="submit">Analyze Emotion</button>
    </form>

    <h2>Result:</h2>
    <pre id="result"></pre>

    <script>
        const form = document.getElementById("emotionForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(e) {
            e.preventDefault(); // prevent page reload
            const text = document.getElementById("text").value;

            const response = await fetch("/emotionDetector", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `text=${encodeURIComponent(text)}`
            });

            const data = await response.json();
            result.textContent = JSON.stringify(data, null, 2); // pretty print
        });
    </script>
</body>
</html>
